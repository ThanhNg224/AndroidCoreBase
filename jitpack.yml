# JitPack builds with its own default JDK unless told otherwise; this project needs 21.
jdk:
  - openjdk21
install:
  # Both published modules must be listed. JitPack scans ~/.m2 after this command, so a module
  # missing here simply never gets a coordinate -- scripts/verify-publication.sh cannot catch it,
  # because that script publishes to its own temporary repository and never reads jitpack.yml.
  - ./gradlew :core:publishToMavenLocal :core:ui-compose:publishToMavenLocal -x test
